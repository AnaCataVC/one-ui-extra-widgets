name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify release tag matches versionName
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION=$(grep -E 'versionName\s*=' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "Error: Tag $GITHUB_REF_NAME ($TAG_VERSION) does not match versionName ($APP_VERSION) in app/build.gradle.kts"
            exit 1
          fi

      - name: Check project invariants
        run: python3 scripts/check_invariants.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Verify and Decode Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$RELEASE_KEYSTORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "Error: Missing one or more release signing secrets (RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks

      - name: Assemble Release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Clean up Keystore
        if: always()
        run: rm -f keystore.jks

      - name: Package Release Asset
        run: |
          TAG_NAME="${{ github.ref_name }}"
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)

          if [ -z "$APK_SRC" ] || [ ! -f "$APK_SRC" ]; then
            echo "Error: Release APK not found in app/build/outputs/apk/release"
            exit 1
          fi

          APK_DEST="OneUiExtraWidgets-${TAG_NAME}.apk"
          cp "$APK_SRC" "$APK_DEST"
          sha256sum "$APK_DEST" > "${APK_DEST}.sha256"
          echo "ASSET_APK=$APK_DEST" >> $GITHUB_ENV
          echo "ASSET_SHA=${APK_DEST}.sha256" >> $GITHUB_ENV

      - name: Upload Release Asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET_APK }}
            ${{ env.ASSET_SHA }}
          draft: false
          prerelease: false
          generate_release_notes: true
